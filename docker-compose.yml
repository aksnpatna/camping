version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camping-backend
    restart: unless-stopped
    ports:
      - "8021:8021"
    environment:
      - DATABASE_URL=postgresql+psycopg2://realestate_user:realestate_pass@realestate-db:5432/camping_db
      - LOCAL_LLM_URL=http://host.docker.internal:8002/v1
      - LOCAL_LLM_MODEL=qwen3:9b
      - PROXY_URL=http://smart-kfoqvnzaqnhn_area-AU:ZDlM6kl6yLoNBcz2@proxy.smartproxy.net:3120
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - realestate_default
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8021/api/v1/health\").read()' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: camping-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3021:3021"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_INTERNAL_URL=http://camping-backend:8021
      - API_URL=http://camping-backend:8021/api/v1
    networks:
      - default
      - asx-prediction_default
      - realestate_default

networks:
  default:
  realestate_default:
    external: true
  asx-prediction_default:
    external: true
